name: Develop Build Artifacts

on:
  push:
    branches:
      - develop
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-artifacts:
    name: Build (${{ matrix.platform }}, ${{ matrix.args }})
    runs-on: ${{ matrix.platform }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            args: --bundles deb
            artifact_name: easyphotoprint-deb
            artifact_path: src-tauri/target/release/bundle/deb/*.deb
          - platform: ubuntu-22.04
            args: --bundles rpm
            artifact_name: easyphotoprint-rpm
            artifact_path: src-tauri/target/release/bundle/rpm/*.rpm
          - platform: windows-latest
            args: --bundles msi
            artifact_name: easyphotoprint-windows-msi
            artifact_path: src-tauri/target/release/bundle/msi/*.msi
          - platform: macos-latest
            args: --bundles dmg --target aarch64-apple-darwin
            artifact_name: easyphotoprint-macos-dmg
            artifact_path: src-tauri/target/release/bundle/dmg/*.dmg

    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        if: matrix.platform != 'macos-latest'
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9
        with:
          toolchain: stable

      - name: Setup Rust (macOS target)
        if: matrix.platform == 'macos-latest'
        uses: dtolnay/rust-toolchain@efa25f7f19611383d5b0ccf2d1c8914531636bf9
        with:
          toolchain: stable
          targets: aarch64-apple-darwin

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libsoup-3.0-dev \
            libayatana-appindicator3-dev \
            libxdo-dev \
            librsvg2-dev \
            patchelf

      - name: Install frontend dependencies
        run: npm ci

      - name: Build platform bundle
        run: npm run tauri build -- ${{ matrix.args }}

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
