[package]
name = "easy-photo-print"
version = "0.1.16"
description = "A lightweight modern photo layout and print desktop app, inspired by classic tools such as PhotoPrint"
authors = ["Patrick Weiss"]
homepage = "https://github.com/bitflip55/EasyPhotoPrint"
license = "MIT"
edition = "2021"

[lib]
name = "easy_photo_print_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
